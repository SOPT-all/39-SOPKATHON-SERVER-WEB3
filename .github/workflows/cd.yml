name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  APP_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/sopkathon:${{ github.sha }}
  DEPLOY_DOMAIN: sopkathon-web3.r-e.kr
  DOCKER_BUILD_RECORD_UPLOAD: 'false'

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: 배포 접속 정보 확인
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST_FINGERPRINT: ${{ secrets.EC2_HOST_FINGERPRINT }}
        run: |
          for name in DOCKERHUB_USERNAME DOCKERHUB_TOKEN EC2_HOST EC2_USERNAME EC2_SSH_KEY EC2_HOST_FINGERPRINT; do
            if [[ -z "${!name}" ]]; then
              echo "::error::GitHub Secret 누락: $name"
              exit 1
            fi
          done

      - name: Java 21 설정
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: 배포 전 테스트
        run: ./gradlew --no-daemon test

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Docker Hub 로그인
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 서버 이미지 빌드 및 업로드
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.APP_IMAGE }}

      - name: EC2에 배포 설정 전달
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ secrets.EC2_HOST_FINGERPRINT }}
          source: docker-compose.prod.yml,nginx/http.conf.template,nginx/https.conf.template
          target: /home/ubuntu/sopkathon
          overwrite: true

      - name: EC2 앱 배포
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          APP_IMAGE: ${{ env.APP_IMAGE }}
          DEPLOY_DOMAIN: ${{ env.DEPLOY_DOMAIN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ secrets.EC2_HOST_FINGERPRINT }}
          envs: APP_IMAGE,DEPLOY_DOMAIN
          command_timeout: 10m
          script: |
            set -eu
            cd /home/ubuntu/sopkathon
            test -f .env
            chmod 600 .env

            compose() {
              sudo env APP_IMAGE="$APP_IMAGE" docker compose -f docker-compose.prod.yml "$@"
            }

            compose config --quiet
            compose pull app
            compose up -d --wait --wait-timeout 120
            compose exec -T nginx nginx -t
            compose exec -T nginx nginx -s reload

            ready=false
            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error --max-time 5 \
                --resolve "$DEPLOY_DOMAIN:443:127.0.0.1" \
                "https://$DEPLOY_DOMAIN/v3/api-docs" > /dev/null; then
                ready=true
                break
              fi
              sleep 3
            done
            if [ "$ready" != true ]; then
              echo '배포 후 앱 응답 확인 실패'
              exit 1
            fi

            python3 - <<'PYTHON'
            import os
            from pathlib import Path

            path = Path('.env')
            lines = path.read_text().splitlines()
            lines = [line for line in lines if not line.startswith('APP_IMAGE=')]
            lines.append('APP_IMAGE=' + os.environ['APP_IMAGE'])
            path.write_text('\n'.join(lines) + '\n')
            PYTHON

      - name: 외부 HTTPS 접속 확인
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 3 \
            --connect-timeout 5 --max-time 15 \
            "https://$DEPLOY_DOMAIN/v3/api-docs" > /dev/null
