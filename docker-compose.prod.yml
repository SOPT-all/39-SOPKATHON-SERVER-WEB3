name: sopkathon-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    mem_limit: 640m
    environment:
      MYSQL_DATABASE: ${DB_NAME:?Set DB_NAME in .env}
      MYSQL_USER: ${DB_USERNAME:?Set DB_USERNAME in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
      TZ: Asia/Seoul
    command:
      - --innodb-buffer-pool-size=128M
      - --max-connections=50
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP -h 127.0.0.1 -u "$${MYSQL_USER}" "$${MYSQL_DATABASE}" -e "SELECT 1" > /dev/null 2>&1'
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    logging: *logging

  app:
    image: ${APP_IMAGE:?Set APP_IMAGE to a versioned image in .env}
    restart: unless-stopped
    mem_limit: 768m
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:?Set DB_NAME in .env}
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6.2-sol}
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx384m -XX:+ExitOnOutOfMemoryError
      TZ: Asia/Seoul
    expose:
      - "8080"
    logging: *logging

  nginx:
    image: nginx:1.30.7-alpine
    restart: unless-stopped
    mem_limit: 64m
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:-_}
      NGINX_ENVSUBST_FILTER: ^DOMAIN$
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - type: bind
        source: ./nginx/${NGINX_TEMPLATE:-http.conf.template}
        target: /etc/nginx/templates/default.conf.template
        read_only: true
        bind:
          create_host_path: false
      - certbot-conf:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    command:
      - /bin/sh
      - -c
      - |
        (while :; do sleep 6h; nginx -t && nginx -s reload; done) &
        exec /docker-entrypoint.sh nginx -g 'daemon off;'
    logging: *logging

  certbot:
    image: certbot/certbot:v5.10.0
    profiles: [https]
    restart: unless-stopped
    mem_limit: 128m
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: /bin/sh
    command:
      - -c
      - |
        trap 'exit 0' TERM INT
        while :; do
          certbot renew --webroot -w /var/www/certbot --non-interactive
          sleep 12h &
          wait $$!
        done
    logging: *logging

volumes:
  mysql-data:
  certbot-conf:
  certbot-www:
